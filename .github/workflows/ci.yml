name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Prueba de humo en navegador
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Descargar el build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Arranca `vite preview` con el dist y comprueba que la app monta y que
      # los colores llegan al contraste AA. Ver `playwright.config.ts`.
      - name: Prueba de humo
        run: npm run test:e2e

      - name: Subir el informe si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
