<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar el destello (FOUC).
      try {
        var stored = localStorage.getItem('budgetify:theme') || 'system'
        var dark =
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <meta
      name="description"
      content="Crea, calcula y exporta presupuestos médicos con precios editables por caso."
    />
    <title>Budgetify · Presupuestos Médicos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
